<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Órbita</title>
  </head>
  <body>
    <div id="toast" role="status" aria-live="polite">
      <div class="glass"></div>
      <div class="toast-icon"></div>
      <div class="toast-text">
        <div class="toast-title"></div>
        <div class="toast-detail"></div>
        <div class="toast-note"></div>
      </div>
      <button class="toast-action" type="button">Abrir pasta</button>
      <button class="toast-close" type="button" aria-label="Fechar">×</button>
    </div>
    <script type="module" src="/src/toast.ts"></script>
  </body>
</html>
