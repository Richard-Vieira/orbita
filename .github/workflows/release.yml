name: Release

# Gera o instalador e publica em Releases ao enviar uma tag de versão:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir versão da tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $conf) { throw "A tag ($tag) não bate com a versão em tauri.conf.json ($conf)." }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: orbita-windows
          save-if: false

      - name: Baixar pdfium (versão fixa, SHA-256 conferido)
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1

      - name: Gerar instalador
        run: |
          npm ci
          npm run tauri build

      - name: Publicar em Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $built = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          # Nome sem acento: o GitHub altera caracteres especiais em anexos.
          $name = "Orbita_${version}_x64-setup.exe"
          Copy-Item $built.FullName $name
          '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $name).Hash.ToLower(), $name |
            Set-Content -Encoding utf8NoBOM SHA256SUMS.txt
          gh release create '${{ github.ref_name }}' $name SHA256SUMS.txt `
            --title "Órbita ${{ github.ref_name }}" --notes-file .github/release-notes.md
